name: Auto Post

on:
  schedule:
    # Seg, Qua, Sex às 12:00 UTC = 09:00 horário de Brasília
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch: # permite rodar manualmente pela interface do GitHub

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Gerar e publicar posts com imagens
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_URL: ${{ secrets.BLOG_URL }}
          BLOG_ADMIN_EMAIL: ${{ secrets.BLOG_ADMIN_EMAIL }}
          BLOG_ADMIN_PASSWORD: ${{ secrets.BLOG_ADMIN_PASSWORD }}
        run: npx tsx scripts/auto-post.ts
